
services:
  web1:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./web1/index.html:/usr/share/nginx/html/index.html:ro
      - ./web1/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web2

  web2:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./web2/index.html:/usr/share/nginx/html/index.html:ro

# volume: src:des:mode (ro:read write) 
